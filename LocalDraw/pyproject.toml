[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-comic-studio"
version = "0.1.3"
description = "本地中文漫画剧本与文字分镜工作室"
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema==4.26.0", "Pillow==12.3.0", "websocket-client==1.9.0", "pypinyin==0.55.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comic_workflow = ["prompts/*.md"]
